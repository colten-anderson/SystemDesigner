[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemdesigner-voice"
version = "0.1.0"
description = "Voice-agent interview layer for SystemDesigner portfolios"
requires-python = ">=3.11"
# Core package is stdlib-only; everything heavy lives in optional extras so the
# existing scripts/ CLIs and tests keep working with zero dependencies.
dependencies = []

[project.optional-dependencies]
voice = [
    "pipecat-ai[daily,anthropic,deepgram,cartesia,silero]~=1.3",
    "python-dotenv>=1.0",
]
local-audio = [
    "pipecat-ai[local,silero]~=1.3",
]
text = [
    "anthropic>=0.50",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["voice_interview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
