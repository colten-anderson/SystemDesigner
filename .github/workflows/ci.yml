name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # pipecat-ai core (plus its lazily-imported deps) lets the offline
        # pipeline tests run; everything still works without network access.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pipecat-ai websockets openai

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Validate reference portfolios (regression)
        run: python scripts/validate_portfolio.py examples --all

      - name: Stdlib-only check (existing CLIs need zero dependencies)
        run: |
          python - <<'EOF'
          import subprocess, sys, tempfile
          # The scaffold and validator must keep working with bare python.
          tmp = tempfile.mkdtemp()
          for cmd in (
              [sys.executable, "scripts/create_portfolio.py", tmp + "/p", "--dry-run"],
              [sys.executable, "scripts/validate_portfolio.py", "examples", "--all", "--json"],
          ):
              result = subprocess.run(cmd, capture_output=True, text=True)
              assert result.returncode == 0, (cmd, result.stdout, result.stderr)
          print("stdlib-only CLIs OK")
          EOF
